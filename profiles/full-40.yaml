# Broad baseline for the trace-cost article: four local MCP fixtures, ten tools each.
name: full-40
description: "Broad 40-tool surface for research, repository inspection, GitHub, and communication tasks"
collision: error

servers:
  - upstream: examples/mcp/surface-search.json
    projections:
      - { kind: verbatim, name: search-web, tool: search_web }
      - { kind: verbatim, name: search-news, tool: search_news }
      - { kind: verbatim, name: search-images, tool: search_images }
      - { kind: verbatim, name: search-videos, tool: search_videos }
      - { kind: verbatim, name: search-academic, tool: search_academic }
      - { kind: verbatim, name: search-local, tool: search_local }
      - { kind: verbatim, name: search-social, tool: search_social }
      - { kind: verbatim, name: search-patents, tool: search_patents }
      - { kind: verbatim, name: search-packages, tool: search_packages }
      - { kind: verbatim, name: search-vulnerabilities, tool: search_vulnerabilities }

